name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:size

      - name: Package contents
        run: npm pack --dry-run

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || (echo "Tag $GITHUB_REF_NAME does not match package.json $PKG" && exit 1)

      # npm never advances latest for a prerelease. That is right once a stable release
      # exists and wrong before one does: it left `npm i agrimensor` resolving to
      # alpha.0 while alpha.7 was current. So a prerelease takes latest only while no
      # stable version holds it, and the rule turns itself off the moment one does.
      # It has to be decided here rather than fixed afterwards with `npm dist-tag add`,
      # because OIDC trusted publishing authenticates npm publish and nothing else.
      - name: Resolve dist-tag
        id: disttag
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [[ "$PKG_VERSION" != *-* ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IDENTIFIER=${PKG_VERSION#*-}
          IDENTIFIER=${IDENTIFIER%%.*}

          # an unreadable registry falls through to the identifier, so a transient
          # failure can never hand latest to a prerelease
          if ! CURRENT=$(npm view "$PKG_NAME" dist-tags.latest 2>/dev/null); then
            echo "could not read the current latest, publishing under $IDENTIFIER"
            echo "tag=$IDENTIFIER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$CURRENT" && "$CURRENT" != *-* ]]; then
            echo "latest is $CURRENT, a stable release, publishing under $IDENTIFIER"
            echo "tag=$IDENTIFIER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "no stable release holds latest, so $PKG_VERSION takes it"
          echo "tag=latest" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: exists
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$PKG_VERSION is already published, nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.already == 'false'
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
