name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Package contents
        run: npm pack --dry-run

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') == false
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: tag
        name: Detect release tag on commit
        run: |
          git fetch --force --tags
          tag="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v' | head -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.tag != ''
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - if: steps.tag.outputs.tag != ''
        run: npm ci

      - if: steps.tag.outputs.tag != ''
        run: npm run build

      - name: Check tag matches package.json version
        if: steps.tag.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "$PKG" || (echo "Tag v$TAG does not match package.json $PKG" && exit 1)

      - name: Publish to npm
        if: steps.tag.outputs.tag != ''
        run: npm publish --provenance --access public
