<!doctype html>
<meta charset="utf-8" />
<title>agrimensor timestamp spike</title>
<script type="module">
  import { run } from "./spike.js";
  run()
    .then((report) => {
      window.__spike = { ok: true, report };
    })
    .catch((error) => {
      window.__spike = { ok: false, error: String(error && error.message) };
    });
</script>
